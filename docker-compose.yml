# CRM_YE on any Linux server: app + PostgreSQL + Caddy (automatic HTTPS).
#   1. Point the domain's DNS A record at the server.
#   2. cp .env.example .env  and fill it in (DOMAIN, POSTGRES_PASSWORD, secrets…).
#   3. docker compose up -d --build
# Full guide (incl. moving existing data in): DEPLOY.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crmye
      POSTGRES_USER: crmye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crmye -d crmye']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crmye:${POSTGRES_PASSWORD}@db:5432/crmye
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      DATA_DIR: /app/data
      # Caddy appends the real client IP to X-Forwarded-For.
      CLIENT_IP_HEADER: x-forwarded-for
      PORT: '3006'
    volumes:
      # Plain folders next to this file — easy to see, back up and move.
      - ./data:/app/data
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
